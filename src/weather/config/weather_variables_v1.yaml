contract_version: "weather_variables_v1"
applies_to_endpoints:
  - "forecast"
  - "historical_forecast"
min_supported_date: "2022-01-01"
model: "gfs_global"
timeformat: "unixtime"
units:
  temperature_unit: "celsius"
  wind_speed_unit: "ms"
  precipitation_unit: "mm"

core_hourly_variables:
  - "temperature_2m"
  - "relative_humidity_2m"
  - "precipitation"
  - "wind_speed_10m"

hourly_variables:
  - "temperature_2m"
  - "relative_humidity_2m"
  - "dew_point_2m"
  - "apparent_temperature"
  - "wet_bulb_temperature_2m"
  - "vapour_pressure_deficit"
  - "precipitation_probability"
  - "precipitation"
  - "rain"
  - "showers"
  - "snowfall"
  - "snow_depth"
  - "weather_code"
  - "pressure_msl"
  - "surface_pressure"
  - "cloud_cover"
  - "cloud_cover_low"
  - "cloud_cover_mid"
  - "cloud_cover_high"
  - "visibility"
  - "wind_speed_10m"
  - "wind_speed_80m"
  - "wind_speed_120m"
  - "wind_direction_10m"
  - "wind_direction_80m"
  - "wind_direction_120m"
  - "wind_gusts_10m"
  - "uv_index"
  - "uv_index_clear_sky"
  - "is_day"
  - "sunshine_duration"
  - "shortwave_radiation"
  - "direct_radiation"
  - "diffuse_radiation"
  - "direct_normal_irradiance"
  - "terrestrial_radiation"
  - "evapotranspiration"
  - "et0_fao_evapotranspiration"
  - "cape"
  - "lifted_index"
  - "convective_inhibition"
  - "freezing_level_height"
  - "boundary_layer_height"
  - "total_column_integrated_water_vapour"

daily_variables:
  - "weather_code"
  - "sunrise"
  - "sunset"
  - "daylight_duration"
  - "wind_direction_10m_dominant"

excluded_all_null_gfs_hourly:
  - "wind_speed_180m"
  - "wind_direction_180m"
  - "soil_temperature_0cm"
  - "soil_temperature_6cm"
  - "soil_temperature_18cm"
  - "soil_temperature_54cm"
  - "soil_moisture_0_to_1cm"
  - "soil_moisture_1_to_3cm"
  - "soil_moisture_3_to_9cm"
  - "soil_moisture_9_to_27cm"
  - "soil_moisture_27_to_81cm"
