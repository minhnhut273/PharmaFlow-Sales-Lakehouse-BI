contract_version: "weather_era5_v1"
applies_to_endpoints:
  - "historical_weather"
min_supported_date: "1940-01-01"
max_supported_date: "2021-12-31"
model: null
timeformat: "unixtime"
units:
  temperature_unit: "celsius"
  wind_speed_unit: "ms"
  precipitation_unit: "mm"

core_hourly_variables:
  - "temperature_2m"
  - "relative_humidity_2m"
  - "precipitation"
  - "wind_speed_10m"

hourly_variables:
  - "temperature_2m"
  - "relative_humidity_2m"
  - "dew_point_2m"
  - "apparent_temperature"
  - "wet_bulb_temperature_2m"
  - "vapour_pressure_deficit"
  - "precipitation"
  - "rain"
  - "showers"
  - "snowfall"
  - "snow_depth"
  - "weather_code"
  - "pressure_msl"
  - "surface_pressure"
  - "cloud_cover"
  - "cloud_cover_low"
  - "cloud_cover_mid"
  - "cloud_cover_high"
  - "wind_speed_10m"
  - "wind_speed_80m"
  - "wind_speed_120m"
  - "wind_direction_10m"
  - "wind_direction_80m"
  - "wind_direction_120m"
  - "wind_gusts_10m"
  - "is_day"
  - "sunshine_duration"
  - "shortwave_radiation"
  - "direct_radiation"
  - "diffuse_radiation"
  - "direct_normal_irradiance"
